[project]
name = "alice-bob"
version = "0.1.0"
description = "demo for message signing and verification; server-side"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "cryptography>=46.0.2",
    "fastapi[standard]>=0.118.3",
    "uvicorn>=0.37.0",
]


[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
